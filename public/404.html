<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        var base = '/final-project-addyson-beecham/';
        var path = location.pathname;
        var withoutBase = path.startsWith(base) ? path.slice(base.length) : path;
        var target = base + '#/' + withoutBase + location.search + location.hash;
        location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
